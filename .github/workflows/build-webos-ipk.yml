name: Build & Package LG webOS IPK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-ipk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm run test

      - name: Build & Package webOS IPK
        run: npm run build:ipk

      - name: Upload LG webOS IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.kerloy.iptv-webos-ipk
          path: release/*.ipk
